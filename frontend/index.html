<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Web Scraper</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-container">
    <aside class="sidebar">
      <h2>Web Scraper API</h2>
      <nav>
        <button id="nav-scrape" class="nav-btn active">Scrape New URL</button>
        <button id="nav-history" class="nav-btn">Scrape History</button>
      </nav>
    </aside>

    <main class="main-content">
      <!-- SCRAPE VIEW -->
      <section id="view-scrape" class="view active">
        <header>
          <h1>Scrape a Website</h1>
          <p>Enter a URL below to extract its structured data.</p>
        </header>
        
        <form id="scrapeForm" class="scrape-form">
          <input type="url" id="urlInput" placeholder="https://example.com" required />
          <button type="submit" id="scrapeBtn">
            <span id="btnLabel">Scrape</span>
            <span id="spinner" class="spinner hidden"></span>
          </button>
        </form>
        
        <div id="scrapeMessages">
          <p id="errorMsg" class="feedback error hidden"></p>
          <p id="successMsg" class="feedback success hidden"></p>
        </div>

        <div id="scrapeResult" class="result-container hidden">
          <!-- Populated via JS -->
        </div>
      </section>

      <!-- HISTORY VIEW -->
      <section id="view-history" class="view hidden">
        <header>
          <h1>Scrape History</h1>
          <p>View previously scraped pages and search by keywords.</p>
        </header>

        <div class="search-bar">
          <input type="text" id="searchInput" placeholder="Search by keyword (e.g. tech, jobs)..." />
          <button id="searchBtn">Search</button>
          <button id="clearSearchBtn">Clear</button>
        </div>

        <div class="table-container">
          <table id="historyTable">
            <thead>
              <tr>
                <th>ID</th>
                <th>URL</th>
                <th>Title</th>
                <th>Status</th>
                <th>Date</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="historyTbody">
              <!-- Populated via JS -->
            </tbody>
          </table>
        </div>
      </section>

      <!-- DETAIL MODAL -->
      <div id="detailModal" class="modal hidden">
        <div class="modal-content">
          <span class="close-btn" id="closeModalBtn">&times;</span>
          <div id="modalBody">
            <!-- Populated via JS -->
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Configuration for API URL -->
  <script>
    // In production, this can be injected or read from an environment setup
    window.ENV = {
      API_URL: "http://localhost:8000" // Default for local development
    };
  </script>
  <script src="script.js"></script>
</body>
</html>
